name: Build SAMAR APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip SAMAR2-main.zip
        run: |
          mkdir -p extracted_project
          unzip -q SAMAR2-main.zip -d extracted_project
          ls -la extracted_project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(find extracted_project -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAMAR-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
